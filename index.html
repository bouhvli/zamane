<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Shared trips, shopping, and goals for you and your partner, in one calm, mobile-first app." />
    <meta name="theme-color" content="#F5EFF2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0A0D" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zamane" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Zamane</title>

    <!-- Discovered immediately during HTML parsing, unlike a CSS @import
         — connection setup for Google Fonts starts before any stylesheet
         has even downloaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families, one job each (see theme.css).
         Plus Jakarta Sans — every label, description, button and paragraph.
         Sora — the display face and, more importantly, every NUMBER in the
         app. It replaces JetBrains Mono, which was carrying the numeric job
         less well and cost a third family on the critical path. See theme.css
         for why Sora rather than Space Grotesk, which this started as. -->
    <!-- Loaded without blocking the first paint. A plain stylesheet link to a
         third-party origin is render-blocking: nothing at all is painted until
         that cross-origin round trip completes, which on a phone is a couple
         of hundred milliseconds of white screen before the app's own JS has
         even been asked for. `media="print"` makes the browser fetch it at low
         priority without applying it, and the onload handler flips it to
         `all` the moment it arrives. `display=swap` already means text renders
         in the fallback face and swaps in place, so nothing is hidden either
         way — the only change is that the first paint no longer waits. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Sora:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Sora:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
